[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discovery-runtime"
version = "0.2.0"
description = "Generic Intent-Discovery runtime — words → sealed VerifiedIntent via multi-witness readers, fusion, clarification, and seal. Domain-agnostic; RAAAL/Quantify and GRC are consumers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ReDevOps" }]
keywords = ["redevops", "discovery", "intent", "runtime", "verified-intent"]

# Depends ONLY on the canonical value contracts. No domain (finance/GRC) deps — ever.
dependencies = ["runtime-contracts"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://redevops.io"

[tool.setuptools]
packages = ["discovery_runtime"]
